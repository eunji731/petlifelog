server:
  forward-headers-strategy: native   # nginx 뒤에서 X-Forwarded-Proto 신뢰 (HTTPS 리다이렉트 정상 동작)

spring:
  config:
    import: optional:file:.env.dev[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # 배포 환경에서는 validate 또는 none으로 설정
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              ##- account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24시간 (ms)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}   # 배포 환경(HTTPS)에서는 반드시 true로 설정
  upload:
    base-path: ${UPLOAD_BASE_PATH:D:/uploads}
    daily-path: ${app.upload.base-path}/daily
    profile-path: ${app.upload.base-path}/profiles
    files-path: ${app.upload.base-path}/files   # AttachedFile 시스템 저장 루트

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}   # 배포 환경에서는 false로 설정
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  url: https://generativelanguage.googleapis.com/v1beta