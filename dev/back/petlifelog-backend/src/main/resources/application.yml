spring:
  config:
    import: optional:file:.env.dev[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              ##- account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24시간 (ms)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload:
    base-path: D:/uploads
    daily-path: ${app.upload.base-path}/daily
    profile-path: ${app.upload.base-path}/profiles
    files-path: ${app.upload.base-path}/files   # AttachedFile 시스템 저장 루트

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  url: https://generativelanguage.googleapis.com/v1beta