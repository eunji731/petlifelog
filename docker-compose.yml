services:
  backend:
    build: ./dev/back/petlifelog-backend
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - uploads:/var/uploads
    expose:
      - "8080"
    depends_on: []

  frontend:
    build:
      context: ./dev/front/petlifelog
      args:
        NEXT_PUBLIC_BACKEND_URL: ${DOMAIN_URL}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  uploads:
